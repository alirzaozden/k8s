apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse
  namespace: matrix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      labels:
        app: synapse
    spec:
      initContainers:
        - name: generate-config
          image: matrixdotorg/synapse:latest
          command: ["/start.py", "generate"]
          env:
            - name: SYNAPSE_SERVER_NAME
              value: "matrix.local"
            - name: SYNAPSE_REPORT_STATS
              value: "no"
            - name: POSTGRES_HOST
              value: "postgres"
            - name: POSTGRES_DB
              value: "synapse"
            - name: POSTGRES_USER
              value: "synapse_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: synapse-data
              mountPath: /data
      containers:
        - name: synapse
          image: matrixdotorg/synapse:latest
          ports:
            - containerPort: 8008
          volumeMounts:
            - name: synapse-data
              mountPath: /data
      volumes:
        - name: synapse-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
  namespace: matrix
spec:
  selector:
    app: synapse
  ports:
    - port: 8008
      targetPort: 8008
