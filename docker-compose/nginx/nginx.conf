events {}
http {
  server {
    listen 80;
    server_name vote.local;
    location / {
      proxy_pass http://vote:80;
    }
  }
  server {
    listen 80;
    server_name result.local;
    location / {
      proxy_pass http://result:80;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
